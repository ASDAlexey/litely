<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Litely — Sign In</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    p { font-size: 1.2em; }
  </style>
</head>
<body>
  <p id="msg">Redirecting to Litely...</p>
  <script>
    var i18n = {
      en: {
        title: 'Litely \u2014 Sign In',
        redirecting: 'Redirecting to Litely...',
        success: '\u2713 Signed in successfully. You can close this tab.',
        error: 'Authentication failed. Close this tab and try again.',
        missing: 'Missing auth parameters. Close this tab and try again.'
      },
      ru: {
        title: 'Litely \u2014 \u0412\u0445\u043e\u0434',
        redirecting: '\u041f\u0435\u0440\u0435\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0432 Litely...',
        success: '\u2713 \u0412\u0445\u043e\u0434 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d. \u041c\u043e\u0436\u0435\u0442\u0435 \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u044d\u0442\u0443 \u0432\u043a\u043b\u0430\u0434\u043a\u0443.',
        error: '\u041e\u0448\u0438\u0431\u043a\u0430 \u0430\u0443\u0442\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438. \u0417\u0430\u043a\u0440\u043e\u0439\u0442\u0435 \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u0438 \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0441\u043d\u043e\u0432\u0430.',
        missing: '\u041e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u044e\u0442 \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u044b \u0430\u0432\u0442\u043e\u0440\u0438\u0437\u0430\u0446\u0438\u0438. \u0417\u0430\u043a\u0440\u043e\u0439\u0442\u0435 \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u0438 \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0441\u043d\u043e\u0432\u0430.'
      }
    };

    var lang = localStorage.getItem('litely-lang') || (/^ru\b/i.test(navigator.language) ? 'ru' : 'en');
    var t = i18n[lang];

    document.documentElement.lang = lang;
    document.title = t.title;
    document.getElementById('msg').textContent = t.redirecting;

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var port = params.get('state');

    if (code) {
      document.getElementById('msg').textContent = t.success;

      // Send code to localhost TCP server (dev fallback, fires before page navigates)
      if (port) {
        new Image().src = 'http://127.0.0.1:' + port + '/?code=' + encodeURIComponent(code);
      }

      // Try deep link after short delay (production, installed .app)
      setTimeout(function() {
        window.location.href = 'litely://auth?code=' + encodeURIComponent(code);
      }, 300);
    } else if (error) {
      document.getElementById('msg').textContent = t.error;

      if (port) {
        new Image().src = 'http://127.0.0.1:' + port + '/?error=' + encodeURIComponent(error);
      }

      setTimeout(function() {
        window.location.href = 'litely://auth?error=' + encodeURIComponent(error);
      }, 300);
    } else {
      document.getElementById('msg').textContent = t.missing;
    }
  </script>
</body>
</html>
